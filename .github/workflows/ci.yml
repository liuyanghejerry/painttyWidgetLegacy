name: CI Build

on:
  push:
    branches: [ "main", "master", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    container:
      image: stateoftheartio/qt6:6.6-gcc-aqt
      options: --user root
    steps:
      - name: Fix container permissions
        run: chown -R 1001:1001 /__w && chmod -R 755 /__w

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt update
          apt install -y build-essential libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      - name: Build
        run: |
          mkdir -p build && cd build
          qmake ../painttyWidget.pro
          make -j$(nproc)

      - name: Verify build
        run: |
          echo "=== Build output ==="
          ls -la build/
          find build/ -type f -executable -ls 2>/dev/null || true

  build-macos:
    strategy:
      matrix:
        os: [macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 via Homebrew
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install qt@6
          QT_PATH="$(brew --prefix qt@6)"
          echo "Qt6 installed at: $QT_PATH"
          echo "QT6_PATH=$QT_PATH" >> $GITHUB_ENV

      - name: Build
        run: |
          export PATH="$QT6_PATH/bin:$PATH"
          mkdir -p build && cd build
          echo "=== qmake version ==="
          qmake --version
          echo "=== Running qmake ==="
          qmake ../painttyWidget.pro
          echo "=== Running make ==="
          make -j$(sysctl -n hw.logicalcpu)

      - name: Verify build
        run: |
          echo "=== Build output ==="
          ls -la build/
          find build/ -type f -executable -ls 2>/dev/null || true

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt6
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.6.0 win64_msvc2022_64 -O C:\Qt
          "C:\Qt\6.6.0\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: |
          mkdir build
          cd build
          qmake ../painttyWidget.pro
          nmake

      - name: Verify build
        shell: pwsh
        run: Get-ChildItem build/ -Recurse -Name | Select-Object -First 30
