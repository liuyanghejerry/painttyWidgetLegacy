name: CI Build

on:
  push:
    branches: [ "main", "master", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    container:
      image: stateoftheartio/qt6:6.6-gcc-aqt
      options: --user root
    steps:
      - name: Fix container permissions
        run: chown -R 1001:1001 /__w && chmod -R 755 /__w

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt update
          apt install -y build-essential libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      - name: Build
        run: |
          mkdir -p build && cd build
          qmake ../painttyWidget.pro
          make -j$(nproc)

      - name: Verify build
        run: |
          echo "=== Build output ==="
          ls -la build/
          find build/ -type f -executable -ls 2>/dev/null || true

  build-macos:
    strategy:
      matrix:
        os: [macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 (pinned to 6.6.0)
        run: |
          python3 -m venv /tmp/qt-venv
          source /tmp/qt-venv/bin/activate
          pip install aqtinstall
          aqt install-qt mac desktop 6.6.0 clang_64 -O /tmp/Qt
          echo "/tmp/Qt/6.6.0/macos/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          mkdir -p build && cd build
          qmake ../painttyWidget.pro
          make -j$(sysctl -n hw.logicalcpu)

      - name: Verify build
        run: |
          echo "=== Build output ==="
          ls -la build/
          find build/ -type f -executable -ls 2>/dev/null || true

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          modules: 'qtconcurrent'

      - name: Build
        run: |
          mkdir build
          cd build
          qmake ../painttyWidget.pro
          nmake

      - name: Verify build
        shell: pwsh
        run: Get-ChildItem build/ -Recurse -Name | Select-Object -First 30
